apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: pebble
  labels:
    app: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: loadgen
          image: pebble-loadgen:local
          imagePullPolicy: Never
          env:
            - name: SHOP_URL
              value: http://shop:8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
