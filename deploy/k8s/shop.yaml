apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: pebble
  labels:
    app: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: shop
          image: pebble-shop:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: CATALOG_URL
              value: http://catalog:8080
            - name: DATABASE_URL
              value: postgres://pebble:pebble@postgres:5432/pebble
            - name: REDIS_URL
              value: redis://redis:6379
            - name: FORCE_ERROR
              value: "0"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 48Mi
            limits:
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: pebble
spec:
  type: NodePort
  selector:
    app: shop
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
